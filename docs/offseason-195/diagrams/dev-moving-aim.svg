<svg id="dev-moving-aim" width="264" xmlns="http://www.w3.org/2000/svg" class="flowchart" height="928" viewBox="0 0 264 928" role="img" aria-roledescription="flowchart-v2" aria-label="Moving aim predicts the release pivot, includes rotation-induced velocity, and subtracts inherited velocity lead." style="background-color: rgb(255, 255, 255);"><title>Moving aim predicts the release pivot, includes rotation-induced velocity, and subtracts inherited velocity lead.</title><style>#dev-moving-aim{font-family:Arial,sans-serif;font-size:17px;fill:#17243b;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#dev-moving-aim .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#dev-moving-aim .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#dev-moving-aim .error-icon{fill:#ffffff;}#dev-moving-aim .error-text{fill:#000000;stroke:#000000;}#dev-moving-aim .edge-thickness-normal{stroke-width:1px;}#dev-moving-aim .edge-thickness-thick{stroke-width:3.5px;}#dev-moving-aim .edge-pattern-solid{stroke-dasharray:0;}#dev-moving-aim .edge-thickness-invisible{stroke-width:0;fill:none;}#dev-moving-aim .edge-pattern-dashed{stroke-dasharray:3;}#dev-moving-aim .edge-pattern-dotted{stroke-dasharray:2;}#dev-moving-aim .marker{fill:#52657e;stroke:#52657e;}#dev-moving-aim .marker.cross{stroke:#52657e;}#dev-moving-aim svg{font-family:Arial,sans-serif;font-size:17px;}#dev-moving-aim p{margin:0;}#dev-moving-aim .label{font-family:Arial,sans-serif;color:#17243b;}#dev-moving-aim .cluster-label text{fill:#000000;}#dev-moving-aim .cluster-label span{color:#000000;}#dev-moving-aim .cluster-label span p{background-color:transparent;}#dev-moving-aim .label text,#dev-moving-aim span{fill:#17243b;color:#17243b;}#dev-moving-aim .node rect,#dev-moving-aim .node circle,#dev-moving-aim .node ellipse,#dev-movi